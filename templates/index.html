<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>売上（横棒グラフ）</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      font-family: sans-serif;
      margin: 40px;
    }

    .chart-wrap {
      width: 700px;
      max-width: 100%;
    }
  </style>
</head>
<body>

<h1>売上ランキング</h1>

<div class="chart-wrap">
  <canvas id="chart"></canvas>
</div>

<script>
const labels = {{ labels | tojson }};
const sales = {{ sales | tojson }};

new Chart(document.getElementById('chart'), {
  type: 'bar',
  data: {
    labels: labels,
    datasets: [{
      label: '売上（円）',
      data: sales,
      borderWidth: 1
    }]
  },
  options: {
    indexAxis: 'y',
    responsive: true,
    scales: {
      x: {
        beginAtZero: true
      }
    }
  }
});
</script>

</body>
</html>
